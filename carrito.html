<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carro | BLOQUE</title>
  <link rel="icon" href="img/isotipo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- La cabecera y el pie se pintan desde js/app.js -->
  <div id="cabecera" data-activa="carrito"></div>

  <div class="carro">
    <div class="carro-lineas">
      <div class="carro-titulo">
        <h1>CARRO</h1>
        <span class="label" id="num-lineas">00 líneas</span>
      </div>
      <div id="lineas"></div>
    </div>
    <aside class="carro-resumen" id="resumen"></aside>
  </div>

  <div id="pie"></div>

  <!-- Primero los datos, luego las funciones comunes, luego el script de la página -->
  <script src="js/productos.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function pintarCarrito() {
      // Quitamos del carro las líneas de productos que ya no existen en el catálogo
      const carrito = leerCarrito().filter(item => buscarProducto(item.id));
      guardarCarrito(carrito);
      document.getElementById("num-lineas").textContent = dosCifras(carrito.length) + " líneas";

      // Tabla de líneas (o mensaje si está vacío)
      let total = 0;
      if (carrito.length === 0) {
        document.getElementById("lineas").innerHTML = `
          <div class="carro-vacio">
            <p>Vacío. Todavía no has cogido nada de la percha.</p>
            <a href="catalogo.html" class="boton">Ir a la tienda</a>
          </div>`;
      } else {
        const filas = carrito.map((item, index) => {
          const p = buscarProducto(item.id);
          const importe = p.precio * item.cantidad;
          total += importe;
          return `
            <tr>
              <td class="ref">${escapar(p.ref)}</td>
              <td>${escapar(p.nombre)} <span class="talla">— T. ${escapar(item.talla)}</span></td>
              <td class="derecha">
                <div class="stepper">
                  <button onclick="cambiar(${index}, -1)" aria-label="Quitar uno">−</button>
                  <span>${item.cantidad}</span>
                  <button onclick="cambiar(${index}, 1)" aria-label="Añadir uno">+</button>
                </div>
              </td>
              <td class="derecha">${formatearPrecio(importe)}</td>
              <td class="derecha"><button class="quitar" onclick="quitar(${index})" aria-label="Quitar ${escapar(p.nombre)}">✕</button></td>
            </tr>`;
        }).join("");

        document.getElementById("lineas").innerHTML = `
          <table class="tabla-carro">
            <thead><tr><th class="ref">Ref</th><th>Artículo</th><th class="derecha">Cant</th><th class="derecha">Importe</th><th></th></tr></thead>
            <tbody>${filas}</tbody>
          </table>`;
      }

      // Columna de totales
      document.getElementById("resumen").innerHTML = `
        <span class="tag tag-acido">Recogida en 2 h</span>
        <dl class="resumen">
          <div><dt>Subtotal</dt><dd>${formatearPrecio(total)}</dd></div>
          <div><dt>Entrega</dt><dd>Se elige después</dd></div>
          <div><dt>IVA</dt><dd>Incluido</dd></div>
        </dl>
        <div>
          <span class="label">Total</span>
          <div class="total-grande">${formatearPrecio(total)}</div>
        </div>
        <button class="boton boton-lg boton-senal" onclick="pagar()" ${carrito.length === 0 ? "disabled" : ""}>Tramitar pedido</button>
        <a href="catalogo.html" class="boton boton-sm boton-fantasma">Seguir comprando</a>`;
    }

    function cambiar(index, paso) {
      cambiarCantidad(index, paso);
      pintarCarrito();
    }

    function quitar(index) {
      quitarDelCarrito(index);
      pintarCarrito();
    }

    // Para tramitar el pedido hay que tener cuenta. El pago real (Stripe) se conectará más adelante.
    function pagar() {
      if (!haySesion()) {
        window.location.href = "cuenta.html?volver=carrito";
        return;
      }
      alert("El pago todavía no está conectado. Lo añadiremos con Stripe.");
    }

    // Primero pedimos los productos al backend y luego pintamos el carro
    cargarProductos().then(pintarCarrito);
  </script>
</body>
</html>
