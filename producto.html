<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto | BLOQUE</title>
  <link rel="icon" href="img/isotipo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- La cabecera y el pie se pintan desde js/app.js -->
  <div id="cabecera" data-activa="catalogo"></div>

  <div id="ficha"></div>

  <div id="pie"></div>

  <!-- Primero los datos, luego las funciones comunes, luego el script de la página -->
  <script src="js/productos.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Leemos el id de la URL: producto.html?id=3
    const id = new URLSearchParams(window.location.search).get("id");
    const producto = buscarProducto(id);
    let tallaElegida = null;
    let cantidad = 1;

    if (!producto) {
      document.getElementById("ficha").innerHTML =
        '<section class="banda"><h1>NO EXISTE</h1><p><a href="catalogo.html" class="boton">Volver a la tienda</a></p></section>';
    } else {
      document.title = producto.nombre + " | BLOQUE";
      const agotado = producto.stock === 0;

      // Si solo hay una talla disponible, la dejamos elegida
      const disponibles = producto.tallas.filter(t => !producto.agotadas.includes(t));
      if (disponibles.length === 1) tallaElegida = disponibles[0];

      // Filas de la tabla técnica
      const datos = [
        ["Referencia", producto.ref],
        ["Sección", producto.seccion],
        ["Color", producto.color],
        ["Arreglos", "Bajos incluidos, 48 h"],
        ["Cambios", "30 días en tienda"]
      ];

      document.getElementById("ficha").innerHTML = `
        <div class="migas label">
          <a href="catalogo.html">Tienda</a> / ${producto.seccion} / Ref. ${producto.ref}
        </div>
        <section class="ficha">
          <div class="ficha-media">
            ${htmlImagen(producto)}
            <span class="tarjeta-tag">${agotado ? '<span class="tag tag-papel">Agotado</span>' : '<span class="tag tag-acido">Probador libre <i class="parpadeo">■</i></span>'}</span>
          </div>
          <div class="ficha-info">
            <h1>${producto.nombre}</h1>
            <p>${producto.descripcion}</p>

            <table class="tabla-tecnica">
              ${datos.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}
            </table>

            <span class="label">Talla</span>
            <div class="tallas">
              ${producto.tallas.map(t => {
                const fuera = producto.agotadas.includes(t);
                const activa = t === tallaElegida ? "activo" : "";
                return `<button class="${activa}" ${fuera ? "disabled" : ""} onclick="elegirTalla(this, '${t}')">${t}</button>`;
              }).join("")}
            </div>

            <div class="ficha-compra">
              <div>
                <span class="label">Precio</span>
                <div class="precio-grande">${formatearPrecio(producto.precio)}</div>
              </div>
              <div class="stepper">
                <button onclick="cambiar(-1)" aria-label="Quitar uno">−</button>
                <span id="cantidad">1</span>
                <button onclick="cambiar(1)" aria-label="Añadir uno">+</button>
              </div>
            </div>

            <div class="ficha-botones">
              <button class="boton boton-lg boton-senal" onclick="anadir()" ${agotado ? "disabled" : ""}>Añadir al carro</button>
              <a href="catalogo.html" class="boton boton-lg">Seguir mirando</a>
            </div>
            <p class="error" id="error"></p>
          </div>
        </section>`;
    }

    function elegirTalla(boton, talla) {
      tallaElegida = talla;
      document.querySelectorAll(".tallas button").forEach(b => b.classList.remove("activo"));
      boton.classList.add("activo");
      document.getElementById("error").textContent = "";
    }

    // Cambia la cantidad entre 1 y el stock disponible
    function cambiar(paso) {
      cantidad = Math.min(Math.max(1, cantidad + paso), Math.max(1, producto.stock));
      document.getElementById("cantidad").textContent = cantidad;
    }

    function anadir() {
      if (!tallaElegida) {
        document.getElementById("error").textContent = "Elige una talla";
        return;
      }
      anadirAlCarrito(producto.id, tallaElegida, cantidad);
      mostrarAviso("REF. " + producto.ref, "Añadido al carro", producto.nombre + ", talla " + tallaElegida + ".");
    }
  </script>
</body>
</html>
