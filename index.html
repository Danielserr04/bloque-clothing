<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio | BLOQUE</title>
  <link rel="icon" href="img/isotipo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- La cabecera y el pie se pintan desde js/app.js -->
  <div id="cabecera" data-activa="index"></div>

  <!-- Portada: titular a la izquierda, columna técnica a la derecha -->
  <section class="hero">
    <div class="hero-texto">
      <span class="label">Calle Mayor 14 · Temporada 03</span>
      <h1><span class="fino">POCA ROPA</span><br>QUE DURE</h1>
      <p>Ropa de barrio con taller de arreglos. Compra aquí y recoge en dos horas.</p>
      <div class="hero-botones">
        <a href="catalogo.html" class="boton boton-senal">Ver la tienda</a>
        <a href="#destacados" class="boton">Lo nuevo</a>
      </div>
    </div>
    <div class="hero-datos">
      <div class="hero-numero">14</div>
      <div class="hero-cifras">
        <div><span class="label">Prendas</span><strong id="num-prendas">00</strong></div>
        <div><span class="label">Horario</span><strong>9:00-20:00</strong></div>
        <div><span class="label">Recogida</span><strong>2 H</strong></div>
        <div><span class="label">Reparto</span><strong>3,90 €</strong></div>
      </div>
    </div>
  </section>

  <section id="destacados">
    <div class="filtros">
      <span class="label">Lo nuevo</span>
      <a href="catalogo.html" class="boton boton-fantasma boton-sm contador">Ver todo</a>
    </div>
    <div class="rejilla" id="lista"></div>
  </section>

  <div id="pie"></div>

  <!-- Primero los datos, luego las funciones comunes, luego el script de la página -->
  <script src="js/productos.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Primero pedimos los productos al backend y luego pintamos
    cargarProductos().then(() => {
      // Número de prendas en la columna técnica
      document.getElementById("num-prendas").textContent = dosCifras(PRODUCTOS.length);

      // Mostramos los 4 primeros productos como novedades
      document.getElementById("lista").innerHTML = PRODUCTOS.slice(0, 4).map(htmlTarjeta).join("");
    });
  </script>
</body>
</html>
