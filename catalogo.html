<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda | BLOQUE</title>
  <link rel="icon" href="img/isotipo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- La cabecera y el pie se pintan desde js/app.js -->
  <div id="cabecera" data-activa="catalogo"></div>

  <section class="banda">
    <h1><span class="fino">TODO LO QUE</span> HAY</h1>
  </section>

  <div class="filtros" id="filtros"></div>
  <div class="rejilla" id="lista"></div>

  <div id="pie"></div>

  <!-- Primero los datos, luego las funciones comunes, luego el script de la página -->
  <script src="js/productos.js"></script>
  <script src="js/app.js"></script>
  <script>
    function mostrar(seccion) {
      const lista = seccion === "Todo" ? PRODUCTOS : PRODUCTOS.filter(p => p.seccion === seccion);
      document.getElementById("lista").innerHTML = lista.map(htmlTarjeta).join("");

      // Botones de filtro (marcando el activo) + contador de prendas a la derecha
      const botones = SECCIONES.map(s =>
        `<button class="${s === seccion ? "activo" : ""}" onclick="mostrar('${s}')">${s}</button>`
      ).join("");
      document.getElementById("filtros").innerHTML =
        botones + `<span class="label contador">${dosCifras(lista.length)} prendas</span>`;
    }

    mostrar("Todo");
  </script>
</body>
</html>
